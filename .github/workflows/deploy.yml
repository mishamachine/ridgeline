name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1' # Mondays: rebuild trail data from the latest OpenStreetMap extract
  workflow_dispatch:

permissions:
  contents: write # to publish the Hostinger branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: npm test
      - name: Test the elevation code (synthetic tiles, no network)
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check the trail build script on sample data
        run: python scripts/build_trails.py scripts/sample.osm /tmp/sample-trails sample
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Download Washington OpenStreetMap extract (Geofabrik)
        run: curl -fsSL -A "ridgeline-trail-build (github.com/${{ github.repository }})" -o washington.osm.pbf https://download.geofabrik.de/north-america/us/washington-latest.osm.pbf
      - name: Cache Copernicus DEM tiles
        uses: actions/cache@v4
        with:
          path: scripts/.dem-cache
          key: copernicus-dem-90m-v1
      - name: Build hosted trail data (elevation from Copernicus DEM GLO-90)
        run: python scripts/build_trails.py washington.osm.pbf dist/trails "OpenStreetMap via Geofabrik (Washington)"
      - name: Build a root-domain copy for Hostinger (hike.bobolearns.com)
        run: |
          BASE_PATH=/ npx vite build --outDir dist-root --emptyOutDir
          cp -r dist/trails dist-root/trails
          cp deploy/htaccess dist-root/.htaccess
      - name: Publish the Hostinger copy to the 'hostinger' branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist-root
          git init -q -b hostinger
          git -c user.name="ridgeline-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="ridgeline-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
