name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1' # Mondays: rebuild trail data from the latest OpenStreetMap extract
  workflow_dispatch:
  pull_request: # builds only (never deploys) when the trail pipeline changes
    branches: [main]
    paths: ['scripts/**', '.github/workflows/deploy.yml', 'src/lib/cells.ts', 'src/lib/nameIndex.ts', 'src/lib/coverage.ts', 'src/lib/placeIndex.ts']

permissions:
  contents: read # write access is granted per job: the build job (Hostinger branch) and the deploy job (Pages) only

# One deploy at a time; a newer push cancels an older build. Cancelling is safe: the extracts and DEM tiles are
# cached the moment they are downloaded, so a restarted build does not fetch them again. PR builds have their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: npm test
      - name: Test the elevation code and the region tooling (synthetic data, no network)
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check the trail build script on sample data
        run: python scripts/build_trails.py scripts/sample.osm /tmp/sample-trails sample

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 scripts/regions.py matrix)" >> "$GITHUB_OUTPUT"

  # One job per region (scripts/regions.json): a failing region does not stop the others being built,
  # but the combine step below needs all of them.
  region:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ISO week (the extract is downloaded at most once a week per region)
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the Geofabrik extract
        id: pbf
        uses: actions/cache/restore@v4
        with:
          path: extract/${{ matrix.id }}.osm.pbf
          key: geofabrik-${{ matrix.id }}-${{ steps.week.outputs.iso }}
      - name: Download the extract (Geofabrik JSON index, identifying User-Agent)
        if: steps.pbf.outputs.cache-hit != 'true'
        run: mkdir -p extract && python scripts/regions.py fetch ${{ matrix.id }} extract/${{ matrix.id }}.osm.pbf
      - name: Save the extract at once, so a cancelled build does not download it again
        if: steps.pbf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: extract/${{ matrix.id }}.osm.pbf
          key: geofabrik-${{ matrix.id }}-${{ steps.week.outputs.iso }}
      - name: Cache Copernicus DEM tiles (per region)
        uses: actions/cache@v4
        with:
          path: scripts/.dem-cache
          key: copernicus-dem-90m-v1-${{ matrix.id }}
          restore-keys: copernicus-dem-90m-v1
      - name: Build trail data (elevation from Copernicus DEM GLO-90)
        run: python scripts/build_trails.py extract/${{ matrix.id }}.osm.pbf out/${{ matrix.id }} "OpenStreetMap via Geofabrik (${{ matrix.name }})"
      - name: Store each trail's length and gain, measured on the full-resolution line, in the cells
        run: node scripts/trail-stats.mjs out/${{ matrix.id }} ${{ matrix.id }}
      - name: Check counts, collapse tripwire (self-baselined), classic trails and their gain (fails the build)
        run: python scripts/regions.py check ${{ matrix.id }} out/${{ matrix.id }}
      - name: Drop build-only files (full-resolution cells are published only for the region that keeps the old path)
        run: |
          rm -f out/${{ matrix.id }}/stats.json
          ${{ !matrix.v1 && format('rm -rf out/{0}/full', matrix.id) || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: trails-${{ matrix.id }}
          path: out/${{ matrix.id }}
          retention-days: 3

  build:
    needs: [test, region]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the Hostinger branch (main only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/download-artifact@v4
        with:
          pattern: trails-*
          path: regions
      - name: Combine the regions into dist/trails/v2, plus the frozen Washington v1 copy in dist/trails
        run: python scripts/regions.py combine dist/trails regions/*
      - name: Build a root-domain copy for Hostinger (hike.bbprojectfactory.com)
        run: |
          BASE_PATH=/ npx vite build --outDir dist-root --emptyOutDir
          cp -r dist/trails dist-root/trails
          cp deploy/htaccess dist-root/.htaccess
      - name: Pre-render pages for the top 300 trails (SEO), in both copies
        run: |
          BASE_PATH=/${{ github.event.repository.name }}/ node scripts/seo-pages.mjs dist
          BASE_PATH=/ node scripts/seo-pages.mjs dist-root
      - name: Fail if the old domain appears in either build (hike.bbprojectfactory.com is canonical)
        run: |
          if grep -rIil bobolearns dist dist-root; then echo "old domain found in build output"; exit 1; fi
      - name: Publish the Hostinger copy to the 'hostinger' branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd dist-root
          git init -q -b hostinger
          git -c user.name="ridgeline-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="ridgeline-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
