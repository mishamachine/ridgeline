# iOS release: archive, sign for the App Store and upload to TestFlight on a macOS runner.
# Run by hand: Actions -> "iOS release". Needs the secrets in docs/NATIVE_RELEASE.md; without them
# the run ends with a warning and does nothing (no failure, nothing uploaded).
name: iOS release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number for this upload (TestFlight refuses one it has seen)
        default: '1'
      upload:
        description: Upload to TestFlight (off = sign and export the .ipa only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.RIDGELINE_APPLE_TEAM_ID }}
      HAS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_B64 != '' && secrets.RIDGELINE_APPLE_TEAM_ID != '' }}
    steps:
      - name: Check secrets
        run: '[ "$HAS_SECRETS" = true ] || echo "::warning::iOS release skipped: set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64 and RIDGELINE_APPLE_TEAM_ID (docs/NATIVE_RELEASE.md)"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_SECRETS == 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: env.HAS_SECRETS == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Web build (native) + cap sync ios
        if: env.HAS_SECRETS == 'true'
        run: npm ci && npm run build:ios
      - name: No Facebook or Twitter SDK in the release build
        if: env.HAS_SECRETS == 'true'
        run: bash scripts/check-no-social-sdks.sh ios
      - name: API key
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_B64" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive (unsigned; the export signs with the cloud distribution certificate)
        if: env.HAS_SECRETS == 'true'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::build_number must be digits only"; exit 1; }
          VERSION=$(node -p 'require("./package.json").version')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"; echo "ARCHIVE=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"; echo "EXPORT=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO archive | tail -30
      - name: Sign for the App Store (export .ipa)
        if: env.HAS_SECRETS == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -30
      - name: Upload to TestFlight
        if: env.HAS_SECRETS == 'true' && inputs.upload
        run: xcrun altool --upload-app -t ios -f "$EXPORT"/App.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAS_SECRETS == 'true'
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean up keys
        if: always()
        run: rm -rf ~/private_keys
