# Delete an account for a deletion request received by email (docs/DELETE_BY_EMAIL.md, step 5). Run by hand by the owner's agent or the owner only.
# The ONLY input is a request id: the id of a confirmed row in ridgeline.deletion_requests. The account and the mode are looked up on the server, so no user id
# ever appears in this workflow's inputs, environment or logs (this repository is public and GitHub shows a run's inputs on the run page).
# It calls the admin delete function with a secret kept in the GitHub Environment `admin-delete` (restricted to the main branch) and prints only the status.
# It uses no third-party actions.
name: Admin delete

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'id (uuid) of a confirmed deletion request'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-delete
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: admin-delete
    steps:
      - name: Call the admin delete function
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          ADMIN_DELETE_SECRET: ${{ secrets.ADMIN_DELETE_SECRET }}
          ADMIN_DELETE_URL: ${{ vars.ADMIN_DELETE_URL }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::request_id is not a uuid"; exit 1; }
          [ -n "$ADMIN_DELETE_SECRET" ] && [ -n "$ADMIN_DELETE_URL" ] || { echo "::error::ADMIN_DELETE_SECRET and the ADMIN_DELETE_URL variable must be set"; exit 1; }
          http=$(curl -sS --max-time 120 -o out.json -w '%{http_code}' -X POST "$ADMIN_DELETE_URL" \
            -H "x-admin-delete-secret: $ADMIN_DELETE_SECRET" -H 'content-type: application/json' \
            --data "{\"request_id\":\"$REQUEST_ID\"}")
          status=$(jq -r '.status // "unknown"' out.json 2>/dev/null || echo unknown)
          rm -f out.json
          echo "request ending ...${REQUEST_ID: -4}, http $http, status $status"
          [ "$status" = "ok" ]
